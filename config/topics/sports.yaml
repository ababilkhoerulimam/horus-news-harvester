# ==============================================================================
# Topic Configuration: Indonesian Sports Intelligence (NNIH)
# Unifies Football, Basketball, Badminton, and Volleyball into declarative NNIH
# ==============================================================================

topic:
  id: "sports"
  name: "Indonesian National Sports & Athletes"
  description: "Monitoring Liga 1, Timnas Indonesia, IBL, PBSI bulu tangkis, dan Proliga voli"
  default_output: "data/raw/news/sports.jsonl"
  default_dapt_output: "data/processed/nusabert_sports_dapt.txt"

keywords:
  football:
    - "liga 1 indonesia"
    - "timnas indonesia"
    - "pssi"
    - "shin tae-yong"
    - "kualifikasi piala dunia"
    - "persib bandung"
    - "persija jakarta"
    - "persebaya surabaya"
    - "arema fc"
    - "bali united"
    - "psm makassar"
    - "borneo fc"
    - "dewa united fc"

  basketball:
    - "ibl"
    - "indonesian basketball league"
    - "timnas basket indonesia"
    - "perbasi"
    - "satria muda"
    - "pelita jaya"
    - "prawira bandung"

  badminton:
    - "pbsi"
    - "bwf world tour"
    - "indonesia open"
    - "all england"
    - "jonatan christie"
    - "anthony ginting"
    - "fajar alfian"
    - "muhammad rian ardianto"

  volleyball:
    - "proliga"
    - "timnas voli indonesia"
    - "pbvsi"
    - "rivan nurmulki"

portals:
  presets:
    - "national_wire"
    - "regional_epicenters"
  include: []
  exclude: []

social:
  enabled: true
  youtube:
    queries:
      - "timnas indonesia"
      - "liga 1 indonesia"
      - "ibl basket indonesia"
      - "pbsi bulu tangkis"
      - "proliga voli"
    channels: []
    max_videos_per_run: 25
    max_comments_per_video: null
    max_replies_per_comment: null
    max_runtime_seconds: null
    max_seconds_per_video: null
    reply_workers: 4
    request_min_interval_ms: 250
    progress_every: 500
  twitter:
    queries:
      - "timnas indonesia"
      - "liga 1"
      - "pbsi"
    handles:
      - "PSSI"
      - "PBSI"
    max_tweets_per_query: 50

output:
  format: "jsonl"
  min_word_count: 50
